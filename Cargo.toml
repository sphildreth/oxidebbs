[workspace]
resolver = "2"
members = [
    "crates/oxidebbs-server",
    "crates/oxidebbs-core",
    "crates/oxidebbs-term",
    "crates/oxidebbs-telnet",
    "crates/oxidebbs-db",
    "crates/oxidebbs-door",
    "crates/oxidebbs-sysop",
    "crates/oxidebbs-network",
    "crates/oxidebbs-transfer",
    "crates/oxidebbs-ftn",
    "crates/oxidebbs-binkp",
    "crates/oxidebbs-oxidenet",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Steven Hildreth"]
repository = "https://github.com/sphildreth/oxidebbs"

[workspace.dependencies]
# Keep these intentionally broad in the starter repo.
# Pin/update with `cargo add` once implementation begins.
anyhow = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
decentdb = { git = "https://github.com/sphildreth/decentdb", tag = "v2.8.0", package = "decentdb", default-features = false }
toml = "0.8"
nix = { version = "0.31.3", features = ["term", "fs", "user"] }
crossterm = "0.28"
fuzzy-matcher = "0.3"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
