[workspace]
resolver = "2"
members = [
    "crates/oxidebbs-server",
    "crates/oxidebbs-core",
    "crates/oxidebbs-term",
    "crates/oxidebbs-telnet",
    "crates/oxidebbs-db",
    "crates/oxidebbs-door",
    "crates/oxidebbs-sysop",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Steven Hildreth"]
repository = "https://github.com/sphildreth/oxidebbs"

[workspace.dependencies]
# Keep these intentionally broad in the starter repo.
# Pin/update with `cargo add` once implementation begins.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }

# DecentDB should be wired in once the crate/path is finalized.
# decentdb = { path = "../decentdb/crates/decentdb" }
