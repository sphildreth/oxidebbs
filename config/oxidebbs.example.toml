[board]
name = "OxideBBS"
tagline = "Built for sysops. Driven by code."
sysop_name = "Sysop"
timezone = "America/Chicago"

[telnet]
enabled = true
bind = "127.0.0.1:2323"
max_connections = 4
idle_timeout_seconds = 900

[auth]
failed_login_threshold = 5
failed_login_window_minutes = 10
failed_login_lockout_minutes = 15
new_user_security_level = 10

[auth.argon2]
memory_cost_kib = 19456
iterations = 2
parallelism = 1

[audit]
retention_days = 365

[logging]
level = "info"
file_enabled = true
file_name = "oxidebbs-server.log"
format = "text"

[logging.rotation]
strategy = "daily"
max_size_mb = 50
max_files = 14

[database]
path = "./data/oxidebbs.ddb"

[paths]
ansi = "./assets/ansi"
screens = "./assets/screens"
doors = "./doors"
runtime = "./runtime"
logs = "./logs"

[nodes]
count = 4

[sysop]
confirm_quit = true

[terminal]
default_encoding = "cp437"
clear_screen_on_connect = true
welcome_screen = "welcome.ans"
logoff_screen = "logoff.ans"

[flow]
login_screen = "login"
login_menu = "login"
post_login_screens = ["screen1", "screen2"]
main_menu = "main"

[screens.login]
ansi = "login/login.ans"
ansi_40 = "login/login-40.ans"
ascii = "login/login.asc"
text = "login/login.txt"

[screens.screen1]
ansi = "info/screen1.ans"
ascii = "info/screen1.asc"
text = "info/screen1.txt"
pause = true

[screens.screen2]
ansi = "info/screen2.ans"
ascii = "info/screen2.asc"
text = "info/screen2.txt"
pause = true

[screens.main_menu]
ansi = "menus/main/main.ans"
ansi_40 = "menus/main/main-40.ans"
ascii = "menus/main/main.asc"
text = "menus/main/main.txt"
pause = false

[screens.sysop_menu]
ansi = "menus/sysop/sysop.ans"
ansi_40 = "menus/sysop/sysop-40.ans"
ascii = "menus/sysop/sysop.asc"
text = "menus/sysop/sysop.txt"
pause = false

[menus.main]
screen = "main_menu"
prompt = "Command? "

[menus.login]
screen = "login"
prompt = "Login? "

[[menus.login.items]]
key = "L"
label = "Logon"
action = "login"

[[menus.login.items]]
key = "N"
label = "New User"
action = "new_user"

[[menus.login.items]]
key = "G"
label = "Goodbye"
action = "logoff"

[[menus.main.items]]
key = "D"
label = "Doors"
action = "doors"

[[menus.main.items]]
key = "M"
label = "Messages"
action = "messages"

[[menus.main.items]]
key = "G"
label = "Goodbye"
action = "logoff"

[[menus.main.items]]
key = "S"
label = "Sysop"
action = "submenu"
target = "sysop"
min_security_level = 255

[menus.sysop]
screen = "sysop_menu"
prompt = "Sysop? "

[[menus.sysop.items]]
key = "N"
label = "Node Status"
action = "noop"

[[menus.sysop.items]]
key = "R"
label = "Return to main"
action = "submenu"
target = "main"

[[menus.sysop.items]]
key = "G"
label = "Goodbye"
action = "logoff"

[doors]
enabled = true
default_runner = "dosemu"
allowed_runners = ["dosemu", "dosemu2"]

[[doors.definitions]]
key = "oxide-check"
name = "Oxide Door Check"
runner = "dosemu"
working_dir = "./doors/oxide-door-check/dist"
command = "OXIDECHK.EXE"
drop_file = "DORINFO1.DEF"
exclusive = false
time_limit_minutes = 5
enabled = false

[network]
enabled = false

[network.profiles.fidonet]
name = "FidoNet"
enabled = false
adapter = "legacy-ftn"

[network.profiles.fidonet.local_address]
zone = 1
net = 105
node = 42
point = 0

[network.links.fidonet_hub]
network = "fidonet"
address = "1:105/0"
host = "fidonet.example.net"
binkp_port = 24554
password = ""
poll_schedule_minutes = 60
enabled = false
compression = "zip"
transport_security = "plaintext_legacy"
legacy_compatible = true

[admin_web]
enabled = false
bind = "127.0.0.1:8080"
require_tls = true
read_only = true
session_timeout_seconds = 900
csrf_token_ttl_seconds = 900
replay_window_seconds = 300
rate_limit_per_minute = 30

[serial]
enabled = false

[[serial.devices]]
name = "modem"
path = "/dev/ttyUSB0"
baud_rate = 115200
flow_control = "rtscts"

[file_transfers]
enabled = false
max_upload_bytes = 1048576
