name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to validate or publish, such as v1.3.0
        required: true
      source_ref:
        description: Git ref to build; dry runs default to the workflow commit, publishes default to tag_name
        required: false
        default: ""
      dry_run:
        description: Build and smoke artifacts without creating a GitHub release
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare release inputs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      image: ${{ steps.release.outputs.image }}
      image_ref: ${{ steps.release.outputs.image_ref }}
      image_version_tag: ${{ steps.release.outputs.image_version_tag }}
      image_release_tag: ${{ steps.release.outputs.image_release_tag }}
      image_latest_tag: ${{ steps.release.outputs.image_latest_tag }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag_name }}"
          input_ref="${{ github.event.inputs.source_ref }}"
          dry_run="${{ github.event.inputs.dry_run }}"

          if [[ -z "${tag}" ]]; then
            echo "tag_name is required" >&2
            exit 1
          fi

          if [[ "${tag}" != v* ]]; then
            echo "tag_name must include the leading v, such as v1.3.0" >&2
            exit 1
          fi

          case "${dry_run}" in
            true|false) ;;
            *)
              echo "dry_run must be true or false" >&2
              exit 1
              ;;
          esac

          source_ref="${input_ref}"
          if [[ -z "${source_ref}" ]]; then
            if [[ "${dry_run}" == "true" ]]; then
              source_ref="${GITHUB_SHA}"
            else
              source_ref="${tag}"
            fi
          fi

          if [[ "${dry_run}" != "true" && -n "${input_ref}" && "${input_ref}" != "${tag}" && "${input_ref}" != "refs/tags/${tag}" ]]; then
            echo "non-dry-run releases must build the release tag; leave source_ref empty or set it to ${tag}" >&2
            exit 1
          fi

          image_tag="${tag#v}"
          image_tag="${image_tag//[^a-zA-Z0-9_.-]/-}"
          repository_lc="$(tr '[:upper:]' '[:lower:]' <<< "${GITHUB_REPOSITORY}")"
          image_ref="ghcr.io/${repository_lc}"
          publish_latest="false"
          if [[ "${image_tag}" != *-* ]]; then
            publish_latest="true"
          fi

          {
            echo "tag=${tag}"
            echo "source_ref=${source_ref}"
            echo "dry_run=${dry_run}"
            echo "image=oxidebbs:${image_tag}-release"
            echo "image_ref=${image_ref}"
            echo "image_version_tag=${image_ref}:${image_tag}"
            echo "image_release_tag=${image_ref}:v${image_tag}"
            echo "image_latest_tag=${image_ref}:latest"
            echo "publish_latest=${publish_latest}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_REF: ${{ needs.prepare-release.outputs.source_ref }}
      PACKAGE: oxidebbs-${{ needs.prepare-release.outputs.tag }}-${{ matrix.package_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_suffix: linux-x86_64-gnu
            exe_suffix: ""
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package_suffix: macos-x86_64
            exe_suffix: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_suffix: windows-x86_64-msvc
            exe_suffix: ".exe"
            archive: zip

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "${GITHUB_ENV}"

      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p oxidebbs-server --bin oxidebbs-server

      - name: Stage package contents
        shell: bash
        run: |
          stage="dist/${PACKAGE}"
          binary="target/${{ matrix.target }}/release/oxidebbs-server${{ matrix.exe_suffix }}"

          mkdir -p "${stage}"
          cp "${binary}" "${stage}/"
          cp README.md LICENSE NOTICE SECURITY.md "${stage}/"
          cp -R assets config "${stage}/"
          mkdir -p "${stage}/doors"
          cp -R tools/doors/oxide-door-check "${stage}/doors/"
          mkdir -p "${stage}/tools"
          cp -R tools/doors "${stage}/tools/"

          if [[ "${{ runner.os }}" != "Windows" ]] && command -v strip >/dev/null 2>&1; then
            strip "${stage}/oxidebbs-server" || true
          fi

      - name: Create tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"

      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip" -Force

      - name: Create checksum
        shell: bash
        run: |
          archive="dist/${PACKAGE}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

      - name: Verify checksum
        shell: bash
        run: |
          archive="dist/${PACKAGE}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${archive}.sha256"
          else
            shasum -a 256 -c "${archive}.sha256"
          fi

      - name: Smoke packaged binary
        shell: pwsh
        run: |
          $archive = "dist/$env:PACKAGE.${{ matrix.archive }}"
          $smoke = "dist/smoke-$env:PACKAGE"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          if ("${{ matrix.archive }}" -eq "zip") {
            Expand-Archive -Path $archive -DestinationPath $smoke -Force
          } else {
            tar -C $smoke -xzf $archive
          }
          $binary = Join-Path $smoke "$env:PACKAGE/oxidebbs-server${{ matrix.exe_suffix }}"
          & $binary --version

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/${{ env.PACKAGE }}.${{ matrix.archive }}
            dist/${{ env.PACKAGE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  docs-build:
    name: Build docs
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

  docker-image:
    name: Build and publish Docker image
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Build Docker image
        env:
          IMAGE_LATEST_TAG: ${{ needs.prepare-release.outputs.image_latest_tag }}
          IMAGE_RELEASE_TAG: ${{ needs.prepare-release.outputs.image_release_tag }}
          IMAGE_VERSION_TAG: ${{ needs.prepare-release.outputs.image_version_tag }}
          LOCAL_IMAGE: ${{ needs.prepare-release.outputs.image }}
          PUBLISH_LATEST: ${{ needs.prepare-release.outputs.publish_latest }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          tags=(
            -t "${LOCAL_IMAGE}"
            -t "${IMAGE_VERSION_TAG}"
            -t "${IMAGE_RELEASE_TAG}"
          )
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            tags+=(-t "${IMAGE_LATEST_TAG}")
          fi

          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --label "org.opencontainers.image.version=${TAG_NAME#v}" \
            "${tags[@]}" \
            .

      - name: Smoke Docker image
        run: docker run --rm --entrypoint oxidebbs-server "${{ needs.prepare-release.outputs.image }}" --version

      - name: Login to GitHub Container Registry
        if: needs.prepare-release.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish Docker image
        if: needs.prepare-release.outputs.dry_run != 'true'
        env:
          IMAGE_LATEST_TAG: ${{ needs.prepare-release.outputs.image_latest_tag }}
          IMAGE_RELEASE_TAG: ${{ needs.prepare-release.outputs.image_release_tag }}
          IMAGE_VERSION_TAG: ${{ needs.prepare-release.outputs.image_version_tag }}
          PUBLISH_LATEST: ${{ needs.prepare-release.outputs.publish_latest }}
        shell: bash
        run: |
          docker push "${IMAGE_VERSION_TAG}"
          docker push "${IMAGE_RELEASE_TAG}"
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            docker push "${IMAGE_LATEST_TAG}"
          fi

  dry-run-summary:
    name: Summarize dry-run artifacts
    needs:
      - prepare-release
      - build
      - docs-build
      - docker-image
    if: needs.prepare-release.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true

      - name: List packaged artifacts
        shell: bash
        run: |
          echo "Dry run completed for ${{ needs.prepare-release.outputs.tag }}"
          find dist/release-assets -maxdepth 1 -type f -print | sort

  publish-release:
    name: Publish GitHub release
    needs:
      - prepare-release
      - build
      - docs-build
      - docker-image
    if: needs.prepare-release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          mapfile -t artifacts < <(find dist/release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "no release artifacts were downloaded" >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" "${artifacts[@]}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}"
